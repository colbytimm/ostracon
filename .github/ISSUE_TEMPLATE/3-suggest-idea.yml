name: Suggest Idea
description: Propose a new feature or an improvement to Ostracon.
title: "[Idea]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe what you're trying to do and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your Idea
      description: How do you imagine it working?
    validations:
      required: true
  - type: dropdown
    id: device-types
    attributes:
      label: Device Types
      description: Optional. Which platforms is this idea for?
      multiple: true
      options:
        - iOS
        - iPadOS
        - macOS
        - visionOS
        - watchOS
